name: Build installers

# Builds the installer on each platform Lichii supports for players:
#   Windows x64  ·  Linux x64 (Steam Deck desktop mode)  ·  macOS Apple Silicon
# Runs on demand, and on version tags (v*), where it also attaches the files to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: ubuntu-22.04          # older glibc, so the binary also runs on SteamOS
            label: linux-x64-steamdeck
          - os: macos-15              # Apple Silicon runner (macos-14 was retired)
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python tests/test_core.py

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OoT-Controller-UI-Installer.exe -DestinationPath "OoT-Controller-UI-Installer-${{ matrix.label }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/OoT-Controller-UI-Installer
          tar -C dist -czf "OoT-Controller-UI-Installer-${{ matrix.label }}.tar.gz" OoT-Controller-UI-Installer

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "OoT Controller UI Installer.app" "../OoT-Controller-UI-Installer-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.label }}
          path: OoT-Controller-UI-Installer-${{ matrix.label }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum OoT-Controller-UI-Installer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
